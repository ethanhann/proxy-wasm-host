name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run every week even if there is no activity on the repo.
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/test-guests
      - uses: extractions/setup-just@v4
      - run: just build-guests
      - run: just check
      - run: just check-package

  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete,cargo-audit,cargo-deny
      - run: just build-guests
      - run: just check-code-quality

  platforms:
    name: test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets --locked

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4
      - run: just build-guests
      - run: cargo check --workspace --all-targets --locked

  bench:
    name: bench
    # A shared runner gives numbers that show a trend and not a precise cost,
    # so the job runs on the main branch alone and has no gate.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/test-guests
      - uses: extractions/setup-just@v4
      - run: just build-guests
      - run: just bench
      - uses: actions/upload-artifact@v7
        with:
          name: criterion
          path: target/criterion

  badges:
    name: badges
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ check ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/test-guests
      - uses: extractions/setup-just@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: just build-guests

      - name: Count tests
        run: |
          TESTS=$(cargo test --workspace --all-targets --locked -- --list 2>/dev/null \
            | grep -c ': test$' || echo 0)
          echo "TEST_COUNT=${TESTS}" >> "$GITHUB_ENV"

      - name: Measure coverage
        run: |
          cargo llvm-cov \
            --workspace --locked \
            --ignore-filename-regex 'tests/|examples/' \
            --json --output-path coverage.json
          PCT=$(jq '.data[0].totals.lines.percent | . * 10 | floor | . / 10' coverage.json)
          echo "COVERAGE_PCT=${PCT}" >> "$GITHUB_ENV"

      - name: Generate badge JSON
        run: |
          mkdir -p badges
          jq -n --arg count "$TEST_COUNT" \
            '{schemaVersion:1,label:"tests",message:($count+" passed"),color:"brightgreen"}' \
            > badges/tests.json
          jq -n --arg pct "$COVERAGE_PCT" \
            '{schemaVersion:1,label:"coverage",message:($pct+"%"),color:(
              if ($pct|tonumber) >= 80 then "brightgreen"
              elif ($pct|tonumber) >= 60 then "yellow"
              else "red" end)}' \
            > badges/coverage.json

      - name: Deploy badges
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./badges
