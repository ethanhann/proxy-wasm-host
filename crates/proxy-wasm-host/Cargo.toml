[package]
name = "proxy-wasm-host"
version = "0.1.0"
description = "A Proxy-Wasm ABI v0.2.1 host library built on wasmtime"
keywords = ["proxy-wasm", "wasm", "wasmtime", "proxy"]
categories = ["wasm", "network-programming"]
readme = "../../README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
getrandom = "0.4"
thiserror = "2"
tracing = "0.1"
wasmtime = { version = "48.0", default-features = false, features = ["runtime", "cranelift", "std", "addr2line", "demangle"] }

[dev-dependencies]
wat = "1"
