[workspace]
resolver = "3"
members = ["crates/proxy-wasm-host"]
exclude = ["crates/test-guests"]

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/ethanhann/proxy-wasm-host"
authors = ["Ethan Hann"]

[workspace.dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
thiserror = "2"
tiny_http = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi"] }
wasmtime = { version = "49.0", default-features = false, features = ["runtime", "cranelift", "std", "addr2line", "demangle"] }
wat = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
must_use_candidate = "allow"
unwrap_used = "deny"
expect_used = "deny"
